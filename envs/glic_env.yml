name: lamah-ce_lstm

channels:
  - nvidia
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # CUDA stack (kompatibel mit PyTorch + cuML)
  - nvidia::cuda=11.8
  - cudnn
  - pytorch::pytorch=2.0.1=py3.10_cuda11.8_cudnn8.7.0_0
  - pytorch-cuda=11.8

  # weitere libs
  - seaborn
  - contextily
  - umap-learn
  - geopandas

  - ipykernel 
  - ipywidgets

  - pip:
      - neuralhydrology

